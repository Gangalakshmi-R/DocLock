
spring.application.name=doclock-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doclock}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

doclock.security.username=${DOCLOCK_USERNAME:Ganga}
doclock.security.password=${DOCLOCK_PASSWORD:}
doclock.jwt.secret=${DOCLOCK_JWT_SECRET:}
doclock.jwt.expiration-ms=${DOCLOCK_JWT_EXPIRATION:86400000}

doclock.storage.dir=${DOCLOCK_STORAGE_DIR:./storage/uploads}

doclock.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
doclock.ai.ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.1:8b}
doclock.ai.ollama.embed-model=${OLLAMA_EMBED_MODEL:nomic-embed-text}

doclock.ai.chroma.base-url=${CHROMA_BASE_URL:http://localhost:8000}
doclock.ai.chroma.collection-name=${CHROMA_COLLECTION:doclock_vectors}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
