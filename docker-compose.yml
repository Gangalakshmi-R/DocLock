services:
  postgres:
    image: postgres:16-alpine
    container_name: doclock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doclock}
      POSTGRES_USER: ${POSTGRES_USER:-doclock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: doclock-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  chroma:
    image: chromadb/chroma:latest
    container_name: doclock-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  tika:
    image: apache/tika:2.9.2.0-full
    container_name: doclock-tika
    restart: unless-stopped
    ports:
      - "9998:9998"

  ollama-models:
    image: ollama/ollama:latest
    container_name: doclock-model-setup
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$OLLAMA_CHAT_MODEL && ollama pull $$OLLAMA_EMBED_MODEL"]
    restart: "no"

  backend:
    build: ./backend
    container_name: doclock-backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doclock}
      POSTGRES_USER: ${POSTGRES_USER:-doclock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DOCLOCK_USERNAME: ${DOCLOCK_USERNAME:-admin}
      DOCLOCK_PASSWORD: ${DOCLOCK_PASSWORD:?Set DOCLOCK_PASSWORD in .env}
      DOCLOCK_JWT_SECRET: ${DOCLOCK_JWT_SECRET:?Set DOCLOCK_JWT_SECRET in .env}
      DOCLOCK_JWT_EXPIRATION: ${DOCLOCK_JWT_EXPIRATION:-86400000}
      DOCLOCK_STORAGE_DIR: /var/doclock/storage
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-220}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      CHROMA_BASE_URL: http://chroma:8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-doclock_vectors}
      TIKA_URL: http://tika:9998
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
      tika:
        condition: service_started
      ollama-models:
        condition: service_completed_successfully
    volumes:
      - doclock_file_storage:/var/doclock/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/actuator/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  frontend:
    build: ./frontend
    container_name: doclock-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  ollama_data:
  chroma_data:
  doclock_file_storage:
